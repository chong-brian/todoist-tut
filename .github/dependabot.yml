version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One PR for all non-major version updates (keeps noise down)
      npm-version-updates:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      # One PR for all non-major security fixes
      npm-security-updates:
        applies-to: security-updates
        update-types: ["minor", "patch"]
